[package]
name = "commitledger"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"  
bitvec = "1.0.1"
crypto-bigint = { version = "0.5.2", features = ["serde"] }
log = "0.4.14"
rayon = "1.6.1"
serde = { version = "1.0.147", features = ["derive"] }
sha3 = "0.10.5"
digest = "0.10.5"
logproof = { git = "https://github.com/Sunscreen-tech/Sunscreen.git", rev="f8ee4a0dc32418f2acd9e176c6f0af73cdf68d40"}
seal_fhe = { git = "https://github.com/Sunscreen-tech/Sunscreen.git", rev="f8ee4a0dc32418f2acd9e176c6f0af73cdf68d40" }
sunscreen_math = { git = "https://github.com/Sunscreen-tech/Sunscreen.git", rev="f8ee4a0dc32418f2acd9e176c6f0af73cdf68d40" }
sunscreen_bulletproofs = { git = "https://github.com/Sunscreen-tech/Sunscreen.git", rev="f8ee4a0dc32418f2acd9e176c6f0af73cdf68d40"}
curve25519-dalek = { version = "0.8.1", package = "sunscreen_curve25519", git = "https://github.com/Sunscreen-tech/Sunscreen.git", rev="f8ee4a0dc32418f2acd9e176c6f0af73cdf68d40", features = [
    "serde",
    "u64_backend",
    "alloc",
], default-features = false }
merlin = "3.0"
rand = "0.8"
env_logger = "0.10.0"